let adminMode=location.hash==='#admin';

const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const options=()=>data.clubs.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('');
const field=(label,name,type='text',value='',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${escapeHTML(value)}" ${required?'required':''} ${type==='number'?'min="0"':''}></label>`;
const sel=(label,name,html)=>`<label>${label}<select name="${name}">${html}</select></label>`;
const form=(fields,button='Simpan')=>`<form id="editor"><div class="grid">${fields}</div><button class="gold">${button}</button></form>`;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch{alert('Penyimpanan browser penuh atau diblokir. Ekspor cadangan data.')}}
function navigate(p){if(p==='Admin'&&!adminMode)return;page=p;render();scrollTo(0,0)}function adminTab(t){tab=t;render()}
function standings(){let t=data.clubs.map(c=>({id:c.id,name:c.name,m:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));for(const x of data.matches.filter(m=>m.done)){let a=t.find(z=>z.id===x.home),b=t.find(z=>z.id===x.away);if(!a||!b)continue;a.m++;b.m++;a.gf+=x.hg;a.ga+=x.ag;b.gf+=x.ag;b.ga+=x.hg;if(x.hg>x.ag){a.w++;b.l++;a.pts+=3}else if(x.hg<x.ag){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}}return t.sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf||a.id-b.id)}
function home(){return `<section class="hero"><small>OFFICIAL PES 6 FOOTBALL LEAGUE</small><h1>${escapeHTML(data.settings.name)}</h1><p>${escapeHTML(data.settings.intro)}</p><p>Musim ${escapeHTML(data.settings.season)}</p><button class="gold" onclick="navigate('Klasemen')">Lihat Klasemen →</button></section><div class="stats"><div><b>${data.clubs.length}</b>Klub</div><div><b>${data.matches.filter(m=>m.done).length}</b>Laga selesai</div><div><b>${data.players.length}</b>Pemain</div></div><div class="card"><h2>Profil & Sistem Kompetisi</h2><p>Format liga 8 klub, dua kali pertemuan, 14 pertandingan per klub. Menang 3 poin, seri 1 poin, kalah 0 poin. Pertandingan dikelola admin liga.</p></div><div class="card"><h2>🌍 Tiket Kompetisi Eropa</h2><p>🥇 Peringkat 1 → UCL (Champions League)<br>🥈 Peringkat 2 → UEL (Europa League)<br>🥉 Peringkat 3 → UECL (Conference League)</p><p class="muted">Tiket ditentukan dari klasemen akhir musim.</p></div><div class="card"><h2>📰 Berita Terbaru</h2>${newsCards(1)}<button onclick="navigate('Berita')">Semua Berita →</button></div>`}
function table(){return `<h2>Klasemen · ${escapeHTML(data.settings.season)}</h2><div class="scroll"><table><tr><th>#</th><th>Zona</th><th>Klub</th><th>M</th><th>W</th><th>D</th><th>L</th><th>SG</th><th>PTS</th></tr>${standings().map((t,i)=>`<tr><td>${i+1}</td><td>${['🏆 UCL','🥈 UEL','🥉 UECL'][i]||'—'}</td><td><b>${escapeHTML(t.name)}</b></td><td>${t.m}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join('')}</table></div><p class="muted">Peringkat: poin, selisih gol, lalu gol memasukkan. Jika masih sama, urutan awal klub digunakan sementara. Posisi 1 lolos UCL, posisi 2 UEL, posisi 3 UECL pada akhir musim.</p>`}
function clubs(){return `<h2>8 Klub Peserta</h2><div class="grid">${data.clubs.map(c=>{const ps=data.players.filter(p=>p.club===c.id);return `<div class="card"><h3>🛡 ${escapeHTML(c.name)}</h3>${c.coach?`<p class="muted">Pelatih: ${escapeHTML(c.coach)}</p>`:''}<p class="muted">${ps.length} pemain terdaftar</p>${['Goalkeeper','Defender','Midfielder','Forward'].map(g=>{const list=ps.filter(p=>(p.group||({'GK':'Goalkeeper','CB':'Defender','LB':'Defender','RB':'Defender','DM':'Midfielder','CM':'Midfielder','AM':'Midfielder','LW':'Forward','RW':'Forward','ST':'Forward'}[p.pos]||'Midfielder'))===g);return list.length?`<h4>${g}</h4><p class="small">${list.map(p=>`${escapeHTML(p.flag||'')} ${escapeHTML(p.name)} (${escapeHTML(p.pos)})${p.number?' #'+escapeHTML(p.number):''}`).join('<br>')}</p>`:''}).join('')}</div>`}).join('')}</div>`}
function schedule(){return `<h2>Jadwal & Hasil</h2>${data.matches.length?data.matches.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<div class="card"><small class="muted">${escapeHTML(m.date)} · Pekan ${m.week} · ${m.done?'FT':'Terjadwal'}</small><h3>${escapeHTML(getClub(m.home))} ${m.done?m.hg+' - '+m.ag:'VS'} ${escapeHTML(getClub(m.away))}</h3>${m.notes?`<p class="muted">${escapeHTML(m.notes)}</p>`:''}</div>`).join(''):'<div class="card">Belum ada jadwal pertandingan.</div>'}`}
function stats(){
 const groups=[{key:'goals',title:'⚽ Peringkat Top Skor',col:'Gol'},{key:'assists',title:'🎯 Peringkat Top Assist',col:'Assist'},{key:'cs',title:'🧤 Peringkat Clean Sheet',col:'CS'}];
 return `<h2>Statistik Pemain · ${escapeHTML(data.settings.season)}</h2><p class="muted">Peringkat gol, assist, dan clean sheet dipisahkan. Data diperbarui otomatis dari statistik pemain di panel Admin.</p>`+groups.map(g=>{
 const ranked=data.players.filter(p=>Number(p[g.key])>0).slice().sort((a,b)=>Number(b[g.key])-Number(a[g.key])||a.name.localeCompare(b.name));
 return `<section class="card"><h3>${g.title}</h3>${ranked.length?`<div class="scroll"><table class="rank-table"><thead><tr><th>Rank</th><th>Pemain</th><th>Klub</th><th>${g.col}</th></tr></thead><tbody>${ranked.map((p,i)=>`<tr><td><strong>${i+1}</strong></td><td>${escapeHTML(p.flag||'')} ${escapeHTML(p.name)}</td><td>${escapeHTML(getClub(p.club))}</td><td><strong>${Number(p[g.key])}</strong></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Belum ada catatan statistik.</p>'}</section>`
 }).join('')
}

function newsCards(limit){return (data.news||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,limit||999).map(n=>`<article class="card"><small class="muted">${escapeHTML(n.date)} · ${escapeHTML(n.category||'Liga')}</small><h3>${escapeHTML(n.title)}</h3><p>${escapeHTML(n.body)}</p></article>`).join('')||'<p>Belum ada berita.</p>'}

if(tab==='Pertandingan')h=`<h3>Tambah Jadwal / Skor</h3>${form(field('Tanggal','date','date')+field('Pekan','week','number','1')+sel('Tuan Rumah','home',options())+sel('Tamu','away',options())+sel('Status','done','<option value="0">Terjadwal</option><option value="1">Selesai / FT</option>')+field('Gol Tuan Rumah','hg','number','0')+field('Gol Tamu','ag','number','0'),'Tambah Pertandingan')}${listing('matches','Pertandingan')}`;
if(tab==='Pemain')h=`<h3>Tambah Pemain / Statistik</h3>${form(field('Nama Pemain','name')+sel('Klub','club',options())+sel('Posisi','pos',['GK','CB','LB','RB','DM','CM','AM','LW','RW','ST'].map(x=>`<option>${x}</option>`).join(''))+field('Gol','goals','number','0')+field('Assist','assists','number','0')+field('Clean Sheet','cs','number','0')+field('Bendera Negara','flag','text','')+field('Nomor Punggung','number','text',''),'Tambah Pemain')}${listing('players','Pemain')}`;
if(tab==='Transfer')h=`<h3>Tambah Transfer</h3>${form(field('Tanggal','date','date')+field('Nama Pemain','name')+field('Klub Asal','from')+field('Klub Tujuan','to')+field('Biaya','fee','text','Gratis'),'Tambah Transfer')}${listing('transfers','Transfer')}`;
if(tab==='Penghargaan')h=`<h3>Tambah Penghargaan</h3>${form(sel('Kategori','type',['TOTW','Ballon d’Or','Golden Boot','Golden Glove','Playmaker Award','Best Manager','Fair Play Award'].map(x=>`<option>${x}</option>`).join(''))+field('Penerima','winner')+field('Pekan / Musim','period','text',data.settings.season),'Tambah Penghargaan')}${listing('awards','Penghargaan')}`;
if(tab==='Berita')h=`<h3>Tambah Berita Liga</h3>${form(field('Tanggal','date','date')+field('Judul','title')+field('Kategori','category','text','Liga')+`<label>Isi Berita<textarea name="body" required></textarea></label>`,'Terbitkan Berita')}${listing('news','Berita')}`;
if(tab==='Cadangan')h=`<h3>Cadangan Data</h3><p>Ekspor data sebelum mengganti HP atau membersihkan browser.</p><button onclick="exportData()">Unduh Cadangan JSON</button><label style="margin-top:14px">Impor Cadangan<input type="file" accept=".json,application/json" onchange="importData(this)"></label><button class="danger" onclick="resetAll()">Reset Semua Data</button>`;
return `<h2>⚙ Panel Admin</h2><button onclick="exitAdmin()">Keluar dari Mode Admin</button><div class="note"><b>Mode lokal:</b> belum memakai password atau database online. Perubahan hanya tersimpan di browser perangkat ini, bukan otomatis terlihat oleh semua pengunjung.</div><div class="tabs">${['Pengaturan','Klub','Pertandingan','Pemain','Transfer','Penghargaan','Berita','Cadangan'].map(x=>`<button class="${tab===x?'active':''}" onclick="adminTab('${x}')">${x}</button>`).join('')}</div><div class="card">${h}</div>`}
function remove(key,id){if(!confirm('Hapus data ini?'))return;data[key]=data[key].filter(x=>x.id!==id);persist();render()}
function submit(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(tab==='Pengaturan'){data.settings={name:f.name,season:f.season,intro:f.intro}}else if(tab==='Klub'){data.clubs.forEach(c=>{c.name=f['club_'+c.id]||c.name;c.coach=f['coach_'+c.id]||''})}else{const key=({Pertandingan:'matches',Pemain:'players',Transfer:'transfers',Penghargaan:'awards',Berita:'news'})[tab];if(!key)return;let x={...f,id:Date.now()+Math.floor(Math.random()*1000)};if(tab==='Pertandingan'){x.home=+f.home;x.away=+f.away;x.week=+f.week;x.hg=+f.hg;x.ag=+f.ag;x.done=f.done==='1';if(x.home===x.away){alert('Tuan rumah dan tamu harus berbeda.');return}if(x.week<1||x.week>14){alert('Pekan harus 1 sampai 14.');return}}if(tab==='Pemain'){x.club=+f.club;x.goals=+f.goals;x.assists=+f.assists;x.cs=+f.cs}data[key].push(x)}persist();render();alert('Perubahan berhasil disimpan di browser!')}
function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='cadangan-pes-galatama.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(input){try{const obj=JSON.parse(await input.files[0].text());if(!obj.settings||!['clubs','matches','players','transfers','awards'].every(k=>Array.isArray(obj[k]))||obj.clubs.length!==8)throw Error('Format cadangan tidak sesuai');if(confirm('Timpa data saat ini?')){data=obj;data.news??=[];persist();render()}}catch(e){alert('Gagal impor: '+e.message)}}
function resetAll(){if(confirm('Hapus seluruh perubahan dan kembali ke data awal?')){data=structuredClone(initial);persist();render()}}
function render(){if(page==='Admin'&&!adminMode)page='Beranda';document.getElementById('brand').textContent='🏆 '+data.settings.name;document.getElementById('nav').innerHTML=(adminMode?[...sections,'Admin']:sections).map(p=>`<button class="${p===page?'active':''}" onclick="navigate('${p}')">${p}</button>`).join('');document.getElementById('view').innerHTML=({Beranda:home,Klasemen:table,Klub:clubs,Jadwal:schedule,Statistik:stats,Transfer:transfers,Penghargaan:awards,Berita:news,Admin:admin})[page]();const form=document.getElementById('editor');if(form)form.addEventListener('submit',submit)}render();
if(adminMode)navigate('Admin');
</script></body></html>
